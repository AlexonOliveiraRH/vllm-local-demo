# KServe model deployment using the separately declared ServingRuntime.
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: qwen25-3b
  labels:
    opendatahub.io/dashboard: "true"
  annotations:
    serving.kserve.io/deploymentMode: RawDeployment
spec:
  predictor:
    minReplicas: 1
    maxReplicas: 1
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
    model:
      runtime: vllm-cuda-runtime
      modelFormat:
        name: vLLM
      storageUri: pvc://model-pvc/
      args:
        - --dtype=auto
        - --max-model-len=4096
        - --enforce-eager
        - --enable-prefix-caching
      resources:
        requests:
          cpu: "4"
          memory: "8Gi"
          nvidia.com/gpu: "1"
        limits:
          cpu: "8"
          memory: "16Gi"
          nvidia.com/gpu: "1"
