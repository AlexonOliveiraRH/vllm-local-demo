# vLLM CUDA ServingRuntime for KServe on RHOAI
#
# The image below comes from the RHOAI 2.25 vllm-cuda-runtime-template.
# To find the correct image for your RHOAI version, run:
#   oc get template vllm-cuda-runtime-template -n redhat-ods-applications \
#     -o jsonpath='{.objects[0].spec.containers[0].image}'
#
# Alternatively, use the upstream vLLM image (no Red Hat subscription required):
#   image: vllm/vllm-openai:latest
apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: vllm-cuda-runtime
  annotations:
    opendatahub.io/recommended-accelerators: '["nvidia.com/gpu"]'
    openshift.io/display-name: vLLM NVIDIA GPU ServingRuntime for KServe
  labels:
    opendatahub.io/dashboard: "true"
spec:
  annotations:
    prometheus.io/path: /metrics
    prometheus.io/port: "8080"
  containers:
    - name: kserve-container
      image: registry.redhat.io/rhoai/odh-vllm-cuda-rhel9@sha256:293c6eb7571bd239516a175b1ebbd4e4bc3b1076022d7aaf6b7f16264227aebf
      command:
        - python
        - -m
        - vllm.entrypoints.openai.api_server
      args:
        - --port=8080
        - --model=/mnt/models
        - --served-model-name={{.Name}}
      env:
        - name: HOME
          value: /tmp
        - name: HF_HOME
          value: /tmp/hf_home
        - name: TRITON_CACHE_DIR
          value: /tmp/.triton
      ports:
        - containerPort: 8080
          protocol: TCP
      startupProbe:
        httpGet:
          path: /health
          port: 8080
        periodSeconds: 10
        failureThreshold: 120
      readinessProbe:
        httpGet:
          path: /health
          port: 8080
        periodSeconds: 10
      livenessProbe:
        httpGet:
          path: /health
          port: 8080
        periodSeconds: 30
        failureThreshold: 3
  multiModel: false
  supportedModelFormats:
    - autoSelect: true
      name: vLLM
