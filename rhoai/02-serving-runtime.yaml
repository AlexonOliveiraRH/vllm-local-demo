# vLLM CUDA ServingRuntime for KServe on RHOAI
#
# The digest below is an RHOAI 3.5.2 example, not a latest-compatible selector.
# Deploy with ./02-deploy-runtime.sh [project], which resolves the installed
# template image without editing this file. 00-run-lab.sh uses the same helper.
# Set VLLM_IMAGE to an explicitly selected compatible image when needed.
#
# Alternatively, use the upstream vLLM image (no Red Hat subscription required):
#   VLLM_IMAGE=vllm/vllm-openai:<tested-version> ./02-deploy-runtime.sh vllm-demo
apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: vllm-cuda-runtime
  annotations:
    opendatahub.io/recommended-accelerators: '["nvidia.com/gpu"]'
    openshift.io/display-name: vLLM NVIDIA GPU ServingRuntime for KServe
    # The dashboard reads template-display-name, not openshift.io/display-name.
    opendatahub.io/template-display-name: vLLM NVIDIA GPU ServingRuntime for KServe
  labels:
    opendatahub.io/dashboard: "true"
spec:
  annotations:
    opendatahub.io/kserve-runtime: vllm
    prometheus.io/path: /metrics
    prometheus.io/port: "8080"
  containers:
    - name: kserve-container
      image: registry.redhat.io/rhaii/vllm-cuda-rhel9@sha256:fd9540f3882b9aae5f862eba6c295d0e9c6b43f8c17b27b179481bfa330bfbc1
      command:
        - python
        - -m
        - vllm.entrypoints.openai.api_server
      args:
        - --port=8080
        - --model=/mnt/models
        - --served-model-name={{.Name}}
      env:
        - name: HOME
          value: /tmp
        - name: HF_HOME
          value: /tmp/hf_home
        - name: TRITON_CACHE_DIR
          value: /tmp/.triton
      ports:
        - containerPort: 8080
          protocol: TCP
      startupProbe:
        httpGet:
          path: /health
          port: 8080
        periodSeconds: 10
        failureThreshold: 120
      readinessProbe:
        httpGet:
          path: /health
          port: 8080
        periodSeconds: 10
      livenessProbe:
        httpGet:
          path: /health
          port: 8080
        periodSeconds: 30
        failureThreshold: 3
  multiModel: false
  supportedModelFormats:
    - autoSelect: true
      name: vLLM
